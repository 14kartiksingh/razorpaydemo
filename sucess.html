<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#f8fafc;
      min-height:100vh;
      display:flex;
      justify-content:center;

      padding:20px;
    }

    .card{
      background:white;
      max-width:500px;

      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);

    }

    .success-icon{
      font-size:70px;
      margin-bottom:20px;
    }

    h1{

      margin-bottom:10px;
    }

    p{
      color:#555;
      line-height:1.7;
      margin-bottom:25px;
    }

    .telegram-btn{
      display:inline-block;
      text-decoration:none;
      background:#229ED9;
      color:white;
      padding:14px 28px;
      border-radius:10px;
      font-weight:bold;
      font-size:16px;
      transition:0.3s;
    }

    .telegram-btn:hover{
      transform:translateY(-2px);
    }

    .note{
      margin-top:20px;
      font-size:14px;
      color:#777;

</head>
